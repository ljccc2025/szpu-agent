<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudOps Tutor · M01-M10 验证页</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#fff; --border:#e5e9f2;
    --ink:#1f2d3d; --ink2:#5e6d82; --ink3:#97a3b7;
    --brand:#2f6bff; --brand-soft:#eaf1ff; --brand-deep:#1e4fd6;
    --ok:#22a06b; --ok-soft:#e6f7ef; --err:#e5484d; --err-soft:#fdecec;
    --term-bg:#161b26; --term-ink:#d7e0ee;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;font-size:14px;}
  header{background:var(--card);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:14px;padding:0 22px;height:54px;flex-shrink:0;}
  .mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;}
  header b{font-size:15px;}
  header small{color:var(--ink3);}
  .tabs{margin-left:auto;display:flex;gap:6px;}
  .tab{padding:7px 16px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:500;}
  .tab.on{background:var(--brand-soft);color:var(--brand);font-weight:600;}
  main{flex:1;overflow:hidden;display:flex;}
  .pane{flex:1;display:none;flex-direction:column;min-width:0;}
  .pane.on{display:flex;}

  /* ---- 聊天 ---- */
  #list{flex:1;overflow-y:auto;padding:24px 10%;}
  .row{display:flex;gap:10px;margin-bottom:18px;max-width:820px;margin-left:auto;margin-right:auto;}
  .row.user{flex-direction:row-reverse;}
  .av{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;
    align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;}
  .av.ai{background:var(--brand);} .av.me{background:linear-gradient(135deg,#ffb64d,#ff8f3d);}
  .bub{max-width:82%;}
  .bub .inner{background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:11px 15px;line-height:1.75;white-space:pre-wrap;word-break:break-word;}
  .row.user .inner{background:var(--brand);border-color:var(--brand);color:#fff;}
  .inner pre{background:var(--term-bg);color:var(--term-ink);border-radius:9px;
    padding:11px 13px;margin:8px 0;overflow-x:auto;white-space:pre;
    font-family:Consolas,monospace;font-size:12.5px;line-height:1.65;position:relative;}
  .inner code{background:#eef1f8;border-radius:4px;padding:0 5px;font-family:Consolas,monospace;font-size:12.5px;}
  .inner pre code{background:none;padding:0;}
  .cite{border:1px solid var(--border);border-radius:10px;margin-top:9px;background:#fafbfe;overflow:hidden;}
  .cite-h{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;
    font-size:12.5px;color:var(--ink2);user-select:none;}
  .cite-h .cnt{background:var(--brand-soft);color:var(--brand);border-radius:6px;
    padding:1px 7px;font-size:11px;font-weight:600;}
  .cite-h .arr{margin-left:auto;color:var(--ink3);transition:transform .2s;}
  .cite.open .arr{transform:rotate(180deg);}
  .cite-b{display:none;border-top:1px solid var(--border);}
  .cite.open .cite-b{display:block;}
  .ci{padding:9px 12px;display:flex;gap:9px;border-bottom:1px solid #eef1f7;font-size:12.5px;}
  .ci:last-child{border:none;}
  .ci .no{width:19px;height:19px;border-radius:6px;background:var(--brand-soft);color:var(--brand);
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ci .src{color:var(--brand);font-weight:600;}
  .ci .qt{color:var(--ink2);margin-top:2px;line-height:1.55;}
  .ci .sc{margin-left:auto;color:var(--ink3);font-size:11px;flex-shrink:0;}
  .meta{font-size:11px;color:var(--ink3);margin-top:5px;padding:0 3px;}
  .row.user .meta{text-align:right;}
  .inputbar{padding:12px 10% 18px;max-width:1000px;margin:0 auto;width:100%;}
  .ibox{background:var(--card);border:1.5px solid var(--border);border-radius:13px;
    padding:10px 12px;display:flex;gap:10px;align-items:center;}
  .ibox:focus-within{border-color:var(--brand);}
  #ipt{flex:1;border:none;outline:none;font-family:inherit;font-size:14px;color:var(--ink);}
  #btn{background:var(--brand);color:#fff;border:none;border-radius:9px;
    padding:9px 22px;font-size:13px;font-weight:600;cursor:pointer;}
  #btn:hover{background:var(--brand-deep);} #btn:disabled{opacity:.5;cursor:wait;}
  .hint{font-size:11px;color:var(--ink3);margin-top:7px;text-align:center;}

  /* ---- 知识库 ---- */
  .kb-wrap{max-width:720px;margin:28px auto;width:92%;overflow-y:auto;}
  .kb-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:16px;}
  .kb-card h3{font-size:14px;margin-bottom:12px;}
  .drop{border:1.5px dashed #c3cfe5;border-radius:10px;padding:26px;text-align:center;color:var(--ink2);}
  .drop input{display:none;}
  .up-btn{display:inline-block;background:var(--brand);color:#fff;border-radius:9px;
    padding:8px 20px;font-weight:600;cursor:pointer;margin-top:10px;}
  #up-status{margin-top:10px;font-size:12.5px;}
  .src-item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #f0f3f9;}
  .src-item:last-child{border:none;}
  .src-item .nm{font-weight:500;}
  .src-item .ck{font-size:12px;color:var(--ink3);}
  .del{margin-left:auto;border:1px solid var(--border);background:var(--card);color:var(--err);
    border-radius:7px;padding:4px 12px;font-size:12px;cursor:pointer;}
  .del:hover{background:var(--err-soft);border-color:var(--err);}
  .empty{color:var(--ink3);text-align:center;padding:18px;font-size:13px;}
</style>
</head>
<body>
<header>
  <div class="mark">C</div>
  <b>CloudOps Tutor</b><small>M01-M10 验证页 · RAG 知识库已接入</small>
  <div class="tabs">
    <div class="tab on" data-p="chat" onclick="tab(this)">学习对话</div>
    <div class="tab" data-p="kb" onclick="tab(this)">课程知识库</div>
  </div>
</header>
<main>
  <section class="pane on" id="pane-chat">
    <div id="list"></div>
    <div class="inputbar">
      <div class="ibox">
        <input id="ipt" placeholder="问一个课程问题，例如：nginx 反向代理怎么配置？">
        <button id="btn" onclick="send()">发送</button>
      </div>
      <div class="hint">课程知识点回答基于知识库检索并附出处；先到「课程知识库」上传课件效果更佳</div>
    </div>
  </section>

  <section class="pane" id="pane-kb">
    <div class="kb-wrap">
      <div class="kb-card">
        <h3>上传课程资料（PDF / TXT / MD）</h3>
        <div class="drop">
          选择文件后自动上传，同名文件将覆盖旧内容<br>
          <label class="up-btn">选择文件<input type="file" id="file" accept=".pdf,.txt,.md" onchange="upload()"></label>
          <div id="up-status"></div>
        </div>
      </div>
      <div class="kb-card">
        <h3>已入库资料</h3>
        <div id="src-list"><div class="empty">加载中…</div></div>
      </div>
    </div>
  </section>
</main>

<script>
const sid = "web-" + Math.random().toString(36).slice(2, 10);
const list = document.getElementById("list");
const ipt = document.getElementById("ipt");
const btn = document.getElementById("btn");

function tab(el){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));
  document.querySelectorAll(".pane").forEach(p=>p.classList.remove("on"));
  el.classList.add("on");
  document.getElementById("pane-" + el.dataset.p).classList.add("on");
  if(el.dataset.p === "kb") loadSources();
}

// 同时转义引号：值可能被放进 HTML 属性，只转义 &<> 会被单引号逃逸
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function md(s){
  let h = esc(s);
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_,l,c)=>`<pre><code>${c}</code></pre>`);
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  return h;
}

function bubble(role, html, metaText, sources){
  const row = document.createElement("div");
  row.className = "row" + (role === "user" ? " user" : "");
  let citeHtml = "";
  if(sources && sources.length){
    const items = sources.map((s,i)=>`
      <div class="ci"><div class="no">${i+1}</div>
        <div><div class="src">${esc(s.source)} · 第${s.page}页</div>
        <div class="qt">${esc(s.excerpt)}…</div></div>
        <div class="sc">相似度 ${s.score}</div></div>`).join("");
    citeHtml = `<div class="cite" onclick="this.classList.toggle('open')">
      <div class="cite-h">📖 回答依据 <span class="cnt">${sources.length} 个出处</span><span class="arr">▾</span></div>
      <div class="cite-b">${items}</div></div>`;
  }
  row.innerHTML = `<div class="av ${role==="user"?"me":"ai"}">${role==="user"?"我":"C"}</div>
    <div class="bub"><div class="inner">${html}</div>${citeHtml}
    <div class="meta">${metaText||""}</div></div>`;
  list.appendChild(row);
  list.scrollTop = list.scrollHeight;
  return row;
}

async function send(){
  const text = ipt.value.trim();
  if(!text) return;
  ipt.value = ""; btn.disabled = true;
  bubble("user", esc(text), new Date().toLocaleTimeString());
  const thinking = bubble("ai", "思考中…");
  try{
    const r = await fetch("/api/chat", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({session_id: sid, message: text})
    });
    if(!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    thinking.remove();
    const srcNote = (data.sources && data.sources.length) ? ` · 引用知识库 ${data.sources.length} 段` : "";
    bubble("ai", md(data.reply), new Date().toLocaleTimeString() + srcNote, data.sources);
    console.log("chat ok");
  }catch(err){
    thinking.remove();
    bubble("ai", "❌ 请求失败：" + esc(err.message));
    console.error(err);
  }finally{ btn.disabled = false; ipt.focus(); }
}
ipt.addEventListener("keyup", e => { if(e.key === "Enter") send(); });

async function upload(){
  const f = document.getElementById("file").files[0];
  if(!f) return;
  const st = document.getElementById("up-status");
  st.style.color = "var(--ink2)"; st.textContent = "上传并向量化中（首次需加载模型，请稍候）…";
  const fd = new FormData(); fd.append("file", f);
  try{
    const r = await fetch("/api/kb/upload", {method:"POST", body: fd});
    const data = await r.json();
    if(!r.ok) throw new Error(data.detail || ("HTTP " + r.status));
    st.style.color = "var(--ok)";
    st.textContent = `✅ ${data.source} 已入库，共 ${data.chunks} 个知识块`;
    loadSources();
  }catch(err){
    st.style.color = "var(--err)"; st.textContent = "❌ " + err.message;
  }
}

async function loadSources(){
  const box = document.getElementById("src-list");
  try{
    const r = await fetch("/api/kb/sources");
    const data = await r.json();
    if(!data.sources.length){ box.innerHTML = '<div class="empty">暂无资料，请先上传课件</div>'; return; }
    box.innerHTML = data.sources.map(s=>`
      <div class="src-item">📄 <span class="nm">${esc(s.source)}</span>
        <span class="ck">${s.chunks} 个知识块</span>
        <button class="del" data-src="${esc(s.source)}">删除</button></div>`).join("");
    // 事件委托：绝不把数据拼进 onclick，文件名里的引号会逃逸成可执行脚本
    box.onclick = (e) => {
      const btn = e.target.closest(".del");
      if(btn) delSource(btn.dataset.src);
    };
  }catch(err){ box.innerHTML = '<div class="empty">加载失败：' + esc(err.message) + "</div>"; }
}

async function delSource(name){
  if(!confirm(`确定删除「${name}」的全部知识块？`)) return;
  await fetch("/api/kb/" + encodeURIComponent(name), {method:"DELETE"});
  loadSources();
}
</script>
</body>
</html>
